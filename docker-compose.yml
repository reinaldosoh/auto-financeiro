version: "3.8"

services:
  auto-financeiro:
    # Chrome .deb do Dockerfile é amd64; no Mac ARM isso evita build quebrado / divergência com a VPS
    platform: linux/amd64
    build: .
    container_name: auto-financeiro-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - PORT=8000
      - DOCKER=true
      - TOTP_STORE_PATH=/data/totp/chaves_totp.json
    volumes:
      - totp-store:/data/totp
    shm_size: "2gb"

volumes:
  totp-store:
