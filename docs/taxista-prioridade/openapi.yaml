openapi: 3.0.3
info:
  title: Machine VPS API — Prioridade do motorista (Relação)
  version: "1.0.0"
  description: |
    API server-to-server para alterar a **Relação** do condutor no painel TaxiMachine
    (**Motorista prioritário** ↔ **Motorista secundário**).

    No formulário `/taxista/update/{id}`, o painel usa o campo `Taxista[taxista_apoio]`:
    - **prioritário** → valor mapeado pelo painel (ex.: `0`)
    - **secundário** → valor mapeado (ex.: `1`)

    Confirmado no painel: `0` = **Motorista prioritário** (padrão de quase todos os cadastros) e
    `1` = **Motorista secundário**. Marcar um motorista como prioritário só tem efeito prático se
    os demais da praça estiverem como secundário.

    **Alterar a relação de todos (laço no cliente)** — a VPS não tem serviço de laço. O sistema que
    chama lista os motoristas com `GET /taxista/listar` e, para cada `taxista_id`, chama
    `PATCH /taxista/{taxista_id}/relacao` (uma chamada por vez, reaproveitando o `X-Session-Token`).
    A rota é idempotente: se o motorista já está no valor pedido, responde `inalterado: true` sem gravar.
    Use `dry_run: true` para ver o que mudaria sem gravar.

    **Erros** — o corpo traz `codigo` estável (ver `ErroDetail`) e o status HTTP correspondente.

    **Autenticação em duas camadas**
    1. **`X-API-Key`** — obrigatória em todas as requisições (chave fornecida pelo operador da VPS).
    2. **Painel Machine** — login da **cidade** (e-mail + senha; 2FA resolvido internamente pela VPS) ou reutilização de sessão via **`X-Session-Token`**.

    **Fluxo recomendado**
    1. `POST /notificacao/login` com e-mail e senha da cidade → guardar `session_token` da resposta.
    2. Nas rotas `/taxista/*`, enviar **`X-Session-Token: {token}`** e o corpo JSON só com os campos da operação.
    3. **Não** envie `session_token` no JSON — a API retorna `401` (use apenas o header).
    4. A sessão vale ~30 minutos. Em `401` com `codigo: sessao_expirada`, faça novo login e continue.
    5. Faça **um** login e reaproveite o token em todo o laço; logins repetidos com e-mail/senha podem retornar `429`.
    6. Antes de ligar uma praça, confira se o 2FA dela está no cofre com `POST /cofre/status` (não precisa de sessão).

    **2FA automático — integração de terceiros**
    O terceiro informa somente o e-mail e a senha do painel Machine da mesma conta/cidade
    conectada no Radar. O TOTP dessa conta deve estar previamente sincronizado no cofre
    criptografado da VPS. O servidor resolve o segredo pelo e-mail e o usa internamente
    tanto no login quanto na confirmação da alteração. O terceiro não envia `chave_secreta`
    nem `codigo_2fa` e não precisa cadastrar ou gerar outro autenticador.
    Se o segredo não estiver disponível, a equipe Radar deve corrigir a integração/cofre;
    não solicitar a chave TOTP ao usuário final nem orientar repetição de cadastro 2FA.
    A presença de uma cidade ativa no Radar, sozinha, não sincroniza automaticamente um
    segredo ausente na VPS. Esta rota não consulta o estado ativo da cidade no Radar.

    **Identificador** — `taxista_id` é o ID numérico do motorista no painel (ex.: coluna ID / URL `/taxista/update/772770`).

servers:
  - url: https://reinaldo-automachine.sw5bxa.easypanel.host
    description: Produção (URL informada pelo operador da VPS)
  - url: http://127.0.0.1:8000
    description: Desenvolvimento local

tags:
  - name: Sistema
  - name: Sessão
  - name: Taxista — prioridade
    description: Ativar ou remover prioridade (relação no cadastro)
  - name: Taxista — listagem
    description: Listar motoristas da cidade por relação e status (somente leitura)
  - name: Cofre 2FA
    description: Saber quais contas já têm o segredo 2FA no cofre da VPS (aptas a logar)

security:
  - ApiKeyAuth: []

paths:
  /health:
    get:
      tags: [Sistema]
      summary: Health check
      operationId: health
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/UnauthorizedApiKey"

  /notificacao/login:
    post:
      tags: [Sessão]
      summary: Login com e-mail e senha (2FA automático no servidor)
      description: |
        Enviar somente e-mail e senha do painel Machine. O servidor consulta o TOTP
        previamente salvo para esse e-mail e faz o 2FA internamente.
        Retorna `session_token` (~30 min), usado no header `X-Session-Token`.
        Não informar chave secreta ou código 2FA no fluxo de terceiros.
      operationId: notificacaoLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginPainelInput"
            example:
              email: cidade@exemplo.com
              senha: "SENHA_DO_PAINEL"
      responses:
        "200":
          description: Login OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginPainelResponse"
        "400":
          $ref: "#/components/responses/ErroNegocio"
        "401":
          $ref: "#/components/responses/UnauthorizedApiKey"
        "429":
          $ref: "#/components/responses/RateLimit"

  /taxista/prioridade/ativar:
    post:
      tags: ["Taxista — prioridade"]
      summary: Dar prioridade ao motorista
      description: |
        Define a relação **prioritário** para o `taxista_id` informado.
        Equivalente a escolher "Motorista prioritário" em **Relação** no cadastro do taxista.
      operationId: taxistaPrioridadeAtivar
      parameters:
        - $ref: "#/components/parameters/SessionTokenHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaxistaPrioridadeInput"
            examples:
              com_sessao:
                summary: Com X-Session-Token (recomendado)
                value:
                  taxista_id: 772770
              com_credenciais:
                summary: E-mail e senha; TOTP interno no servidor
                value:
                  taxista_id: 772770
                  email: cidade@exemplo.com
                  senha: "SENHA_DO_PAINEL"

      responses:
        "200":
          description: Prioridade aplicada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaxistaRelacaoResponse"
              example:
                sucesso: true
                taxista_id: 772770
                relacao: prioritario
                campo: Taxista[taxista_apoio]
                valor_anterior: "1"
                valor_aplicado: "0"
        "400":
          $ref: "#/components/responses/ErroNegocio"
        "403":
          $ref: "#/components/responses/ErroCodigo"
        "404":
          $ref: "#/components/responses/ErroCodigo"
        "409":
          $ref: "#/components/responses/ErroCodigo"
        "422":
          $ref: "#/components/responses/ErroCodigo"
        "401":
          $ref: "#/components/responses/UnauthorizedSession"
        "429":
          $ref: "#/components/responses/RateLimit"

  /taxista/prioridade/remover:
    post:
      tags: ["Taxista — prioridade"]
      summary: Remover prioridade (secundário)
      description: |
        Define a relação **secundário** — remove a prioridade **sem excluir** o cadastro do motorista.
      operationId: taxistaPrioridadeRemover
      parameters:
        - $ref: "#/components/parameters/SessionTokenHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaxistaPrioridadeInput"
            example:
              taxista_id: 772770
      responses:
        "200":
          description: Secundário aplicado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaxistaRelacaoResponse"
              example:
                sucesso: true
                taxista_id: 772770
                relacao: secundario
                campo: Taxista[taxista_apoio]
                valor_anterior: "0"
                valor_aplicado: "1"
        "400":
          $ref: "#/components/responses/ErroNegocio"
        "403":
          $ref: "#/components/responses/ErroCodigo"
        "404":
          $ref: "#/components/responses/ErroCodigo"
        "409":
          $ref: "#/components/responses/ErroCodigo"
        "422":
          $ref: "#/components/responses/ErroCodigo"
        "401":
          $ref: "#/components/responses/UnauthorizedSession"
        "429":
          $ref: "#/components/responses/RateLimit"

  /taxista/relacao:
    post:
      tags: ["Taxista — prioridade"]
      summary: Alterar relação (alias genérico)
      description: |
        Mesmo comportamento de ativar/remover, com `relacao` explícito no JSON:
        `prioritario` ou `secundario`.
      operationId: taxistaRelacao
      parameters:
        - $ref: "#/components/parameters/SessionTokenHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaxistaRelacaoInput"
            example:
              taxista_id: 772770
              relacao: prioritario
      responses:
        "200":
          description: Relação aplicada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaxistaRelacaoResponse"
        "400":
          $ref: "#/components/responses/ErroNegocio"
        "403":
          $ref: "#/components/responses/ErroCodigo"
        "404":
          $ref: "#/components/responses/ErroCodigo"
        "409":
          $ref: "#/components/responses/ErroCodigo"
        "422":
          $ref: "#/components/responses/ErroCodigo"
        "401":
          $ref: "#/components/responses/UnauthorizedSession"
        "429":
          $ref: "#/components/responses/RateLimit"

  /taxista/{taxista_id}/relacao:
    patch:
      tags: ["Taxista — prioridade"]
      summary: Alterar a relação de UM motorista (para laço no cliente)
      description: |
        Define `prioritario` ou `secundario` para o motorista da URL.

        - **Idempotente**: se já estiver no valor pedido, responde `inalterado: true` e **não grava**.
        - **`dry_run: true`**: lê o formulário e devolve `alteracoes_previstas`, sem gravar e sem pedir 2FA.
        - A gravação envia o formulário como o navegador (campos desabilitados não são enviados) e
          **só `Taxista[taxista_apoio]` muda**. Depois relê todos os campos e devolve o diff em
          `alteracoes`; qualquer outro campo alterado aparece em `alteracoes_inesperadas` (deve vir vazio).
        - Motoristas **deletados** (status `D`) não gravam no painel — filtre-os na listagem.
      operationId: taxistaRelacaoPatch
      parameters:
        - name: taxista_id
          in: path
          required: true
          schema:
            type: integer
          example: 772770
        - $ref: "#/components/parameters/SessionTokenHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaxistaRelacaoPatchInput"
            examples:
              aplicar:
                summary: Tornar secundário
                value:
                  relacao: secundario
              simular:
                summary: Só simular (não grava)
                value:
                  relacao: prioritario
                  dry_run: true
      responses:
        "200":
          description: Relação aplicada, já estava no valor pedido, ou simulação
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaxistaRelacaoResponse"
              examples:
                aplicada:
                  value:
                    sucesso: true
                    taxista_id: 772770
                    relacao: secundario
                    campo: Taxista[taxista_apoio]
                    valor_anterior: "0"
                    valor_aplicado: "1"
                    dry_run: false
                    inalterado: false
                    alteracoes:
                      - campo: Taxista[taxista_apoio]
                        antes: ["0"]
                        depois: ["1"]
                    alteracoes_inesperadas: []
                ja_no_valor:
                  value:
                    sucesso: true
                    taxista_id: 772770
                    relacao: secundario
                    campo: Taxista[taxista_apoio]
                    valor_anterior: "1"
                    valor_aplicado: "1"
                    dry_run: false
                    inalterado: true
                    alteracoes: []
                    alteracoes_inesperadas: []
        "400":
          $ref: "#/components/responses/ErroNegocio"
        "401":
          $ref: "#/components/responses/UnauthorizedSession"
        "403":
          $ref: "#/components/responses/ErroCodigo"
        "404":
          $ref: "#/components/responses/ErroCodigo"
        "409":
          $ref: "#/components/responses/ErroCodigo"
        "422":
          $ref: "#/components/responses/ErroCodigo"
        "429":
          $ref: "#/components/responses/RateLimit"

  /taxista/listar:
    get:
      tags: ["Taxista — listagem"]
      summary: Listar motoristas por relação e status
      description: |
        Lê a grade de motoristas do painel (`/taxista/index`) filtrando por **Relação** e **status**.
        Somente leitura. Exige o header `X-Session-Token`.

        - A grade tem **10 itens por página**. Use `pagina`, ou `todas=true` para percorrer todas
          (em praças grandes pode levar minutos; acima de 400 páginas a rota recusa com `lista_grande_demais`).
        - O `status` é sempre enviado ao painel. Sem ele o painel usaria um filtro salvo na sessão
          e o total mudaria. Padrão: `A` (ativos).
        - Exemplo de totais reais (Mariana): todos os status = 1594 (1111 prioritários, 483 secundários);
          só ativos = 192 (182 prioritários, 10 secundários).
      operationId: taxistaListar
      parameters:
        - $ref: "#/components/parameters/SessionTokenHeaderObrigatorio"
        - name: relacao
          in: query
          schema:
            type: string
            enum: [prioritario, secundario, todos]
            default: todos
        - name: status
          in: query
          description: "Letras do painel separadas por vírgula: A ativo, I inativo, S suspenso, G, R rejeitado, D deletado, E em análise, F fila de espera."
          schema:
            type: string
            default: A
          example: A,I
        - name: pagina
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: todas
          in: query
          description: Percorre todas as páginas e devolve todos os itens
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Lista de motoristas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaxistaListaResponse"
              example:
                sucesso: true
                relacao: secundario
                status: ["A"]
                total: 10
                pagina: 1
                paginas: 1
                por_pagina: 10
                todas: true
                completo: true
                itens:
                  - taxista_id: 772770
                    nome: Fulano de Tal
                    status: Ativo
                    categorias: ["Corrida Central", "Maçaneta"]
        "401":
          $ref: "#/components/responses/UnauthorizedSession"
        "403":
          $ref: "#/components/responses/ErroCodigo"
        "422":
          $ref: "#/components/responses/ErroCodigo"
        "400":
          $ref: "#/components/responses/ErroNegocio"

  /cofre/status:
    post:
      tags: ["Cofre 2FA"]
      summary: Quais e-mails já têm o 2FA no cofre da VPS
      description: |
        Para cada e-mail informado, diz se a VPS tem o segredo 2FA daquela conta no cofre.
        É o que define se o login (`POST /notificacao/login`) funciona sem o segredo na chamada.

        - Envie os e-mails de login do painel de cada praça (até **500** por chamada).
        - A resposta é só **booleana** (`no_cofre`). O segredo nunca é devolvido.
        - Só confirma os e-mails que **você** enviou; a rota não lista o cofre.
        - E-mails são comparados sem diferenciar maiúsculas/minúsculas; repetidos e vazios são ignorados.
        - Não exige `X-Session-Token` (não faz login no painel); exige apenas `X-API-Key`.
        - `no_cofre: false` → falta rodar `POST /autenticar` uma vez para essa conta (a equipe Radar faz isso).
      operationId: cofreStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CofreStatusInput"
            example:
              emails:
                - cidade-a@exemplo.com
                - cidade-b@exemplo.com
      responses:
        "200":
          description: Situação de cada e-mail no cofre
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CofreStatusResponse"
              example:
                sucesso: true
                total: 2
                no_cofre: 1
                resultados:
                  - email: cidade-a@exemplo.com
                    no_cofre: true
                  - email: cidade-b@exemplo.com
                    no_cofre: false
        "401":
          $ref: "#/components/responses/UnauthorizedApiKey"
        "422":
          description: Lista inválida ou com mais de 500 e-mails

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  parameters:
    SessionTokenHeader:
      name: X-Session-Token
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: Token de `POST /notificacao/login` (obrigatório se não enviar e-mail/senha no body)

    SessionTokenHeaderObrigatorio:
      name: X-Session-Token
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: Token de `POST /notificacao/login`

  schemas:
    LoginPainelInput:
      type: object
      required: [email, senha]
      properties:
        email:
          type: string
          format: email
        senha:
          type: string
          format: password

    LoginPainelResponse:
      type: object
      additionalProperties: true
      properties:
        session_token:
          type: string
          format: uuid
        sucesso:
          type: boolean
        mensagem:
          type: string

    CidadePainelInput:
      type: object
      description: E-mail e senha do painel; omitir ambos ao usar X-Session-Token. O 2FA fica no servidor.
      properties:
        email:
          type: string
          format: email
        senha:
          type: string
          format: password

    TaxistaPrioridadeInput:
      allOf:
        - $ref: "#/components/schemas/CidadePainelInput"
        - type: object
          required: [taxista_id]
          properties:
            taxista_id:
              type: integer
              description: ID do motorista no painel Machine
              example: 772770
            dry_run:
              type: boolean
              default: false
              description: Lê o formulário e devolve o que seria alterado, sem gravar e sem pedir 2FA

    TaxistaRelacaoInput:
      allOf:
        - $ref: "#/components/schemas/TaxistaPrioridadeInput"
        - type: object
          required: [relacao]
          properties:
            relacao:
              type: string
              enum: [prioritario, secundario]

    TaxistaRelacaoResponse:
      type: object
      properties:
        sucesso:
          type: boolean
        taxista_id:
          type: integer
        relacao:
          type: string
          enum: [prioritario, secundario]
        campo:
          type: string
          description: Nome do campo no POST do painel (ex. Taxista[taxista_apoio])
        valor_anterior:
          type: string
        valor_aplicado:
          type: string
        dry_run:
          type: boolean
        inalterado:
          type: boolean
          description: true quando o motorista já estava no valor pedido (nada foi gravado)
        alteracoes:
          type: array
          description: Diff completo (todos os campos) entre o formulário antes e depois da gravação
          items:
            $ref: "#/components/schemas/AlteracaoCampo"
        alteracoes_inesperadas:
          type: array
          description: Campos alterados além de Taxista[taxista_apoio]. Deve vir vazio.
          items:
            $ref: "#/components/schemas/AlteracaoCampo"
        alteracoes_previstas:
          type: array
          description: Só no dry_run — o que seria alterado
          items:
            $ref: "#/components/schemas/AlteracaoCampo"
        campos_enviados:
          type: integer
          description: Só no dry_run — quantos pares campo/valor seriam enviados ao painel
        campos_desabilitados_nao_enviados:
          type: array
          description: Só no dry_run — campos desabilitados no painel (não são enviados, como no navegador)
          items:
            type: string

    AlteracaoCampo:
      type: object
      properties:
        campo:
          type: string
          example: Taxista[taxista_apoio]
        antes:
          type: array
          items:
            type: string
        depois:
          type: array
          items:
            type: string

    TaxistaRelacaoPatchInput:
      allOf:
        - $ref: "#/components/schemas/CidadePainelInput"
        - type: object
          required: [relacao]
          properties:
            relacao:
              type: string
              enum: [prioritario, secundario]
            dry_run:
              type: boolean
              default: false

    TaxistaItem:
      type: object
      properties:
        taxista_id:
          type: integer
        nome:
          type: string
        status:
          type: string
          example: Ativo
        categorias:
          type: array
          items:
            type: string

    TaxistaListaResponse:
      type: object
      properties:
        sucesso:
          type: boolean
        relacao:
          type: string
          enum: [prioritario, secundario, todos]
        status:
          type: array
          items:
            type: string
        total:
          type: integer
          description: Total de motoristas que atendem ao filtro
        pagina:
          type: integer
        paginas:
          type: integer
        por_pagina:
          type: integer
          example: 10
        todas:
          type: boolean
        completo:
          type: boolean
          description: true quando todas=true e todos os itens foram lidos
        itens:
          type: array
          items:
            $ref: "#/components/schemas/TaxistaItem"

    CofreStatusInput:
      type: object
      required: [emails]
      properties:
        emails:
          type: array
          maxItems: 500
          items:
            type: string
            format: email

    CofreStatusItem:
      type: object
      properties:
        email:
          type: string
          description: E-mail normalizado (minúsculas)
        no_cofre:
          type: boolean
          description: true se a VPS tem o segredo 2FA dessa conta

    CofreStatusResponse:
      type: object
      properties:
        sucesso:
          type: boolean
        total:
          type: integer
          description: E-mails distintos analisados
        no_cofre:
          type: integer
          description: Quantos deles têm o 2FA no cofre
        resultados:
          type: array
          items:
            $ref: "#/components/schemas/CofreStatusItem"

    ErroDetail:
      type: object
      properties:
        sucesso:
          type: boolean
          example: false
        codigo:
          type: string
          description: Código estável do erro (rotas /taxista/*)
          enum:
            - sessao_expirada
            - sem_permissao
            - campo_desabilitado
            - bandeira_desativada
            - usuario_bloqueado
            - taxista_nao_encontrado
            - painel_nao_gravou
            - 2fa_sem_segredo
            - saldo_minimo
            - validacao_painel
            - parametro_invalido
            - lista_grande_demais
            - painel_indisponivel
            - erro_painel
        mensagem:
          type: string

  responses:
    UnauthorizedApiKey:
      description: X-API-Key ausente ou inválida
      content:
        application/json:
          schema:
            type: object
            properties:
              detail:
                type: string
    UnauthorizedSession:
      description: Sessão inválida ou session_token no body
      content:
        application/json:
          schema:
            type: object
            properties:
              detail:
                $ref: "#/components/schemas/ErroDetail"
    ErroNegocio:
      description: Validação ou painel rejeitou o POST
      content:
        application/json:
          schema:
            type: object
            properties:
              detail:
                oneOf:
                  - $ref: "#/components/schemas/ErroDetail"
                  - type: string
    RateLimit:
      description: Muitas tentativas de login
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            type: object
            properties:
              detail:
                $ref: "#/components/schemas/ErroDetail"
    ErroCodigo:
      description: |
        Erro com `codigo` estável e status HTTP específico:

        | codigo | HTTP |
        |---|---|
        | `sessao_expirada` | 401 |
        | `sem_permissao`, `campo_desabilitado`, `bandeira_desativada`, `usuario_bloqueado` | 403 |
        | `taxista_nao_encontrado` | 404 |
        | `painel_nao_gravou`, `2fa_sem_segredo` | 409 |
        | `saldo_minimo`, `validacao_painel`, `parametro_invalido`, `lista_grande_demais` | 422 |
        | `painel_indisponivel` | 502 |
        | `erro_painel` | 400 |
      content:
        application/json:
          schema:
            type: object
            properties:
              detail:
                $ref: "#/components/schemas/ErroDetail"
          example:
            detail:
              sucesso: false
              codigo: painel_nao_gravou
              mensagem: "Painel não gravou Taxista[taxista_apoio]: esperado value='1', lido='0' após POST."
